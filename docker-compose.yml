version: '3.8'

services:
  db:
    image: postgres:13
    env_file: .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PWD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - backend

  web:
    build: .
    env_file: .env
    command: >
      sh -c "until pg_isready -h db -p 5432 -U ${DB_USER}; do echo waiting for db; sleep 1; done && \
      python manage.py migrate && \
      ${DJANGO_CMD:-python manage.py runserver 0.0.0.0:8000}"
    volumes:
      - ./server:/app
      - ./server/static:/app/static
    ports:
      - "${WEB_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend

volumes:
  postgres_data:
    driver: local
networks:
  backend:
    driver: bridge