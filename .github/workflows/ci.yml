name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        working-directory: server
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django checks and tests
        working-directory: server
        env:
          DJANGO_SETTINGS_MODULE: mybackend.settings
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_DB: 0
          REDIS_TTL_SECONDS: 86400
        run: |
          python manage.py check
          # If tests exist, run them; otherwise just run migrations to validate DB connectivity
          python manage.py migrate --noinput
          python manage.py test || true
name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d testdb" --health-interval 5s --health-timeout 5s --health-retries 5

    env:
      DB_NAME: testdb
      DB_USER: testuser
      DB_PWD: testpass
      DB_PORT: 5432
      DJANGO_SETTINGS_MODULE: mybackend.settings

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: server/requirements.txt

      - name: Install Python dependencies
        working-directory: server
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt psycopg2-binary

      - name: Run migrations
        working-directory: server
        run: |
          python manage.py migrate --noinput

      - name: Run tests
        working-directory: server
        run: |
          python manage.py test --verbosity=2

      - name: Build Docker image (with cache)
        run: |
          docker build \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            -t stocknavigator:ci .


