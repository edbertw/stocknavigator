client_secret = some_secret
scopes = user:email
auth_url = https://github.com/login/oauth/authorize
token_url = https://github.com/login/oauth/access_token
api_url = https://api.github.com/user
team_ids = 
allowed_organizations = 

[auth.google]
enabled = false
client_id = some_client_id
client_secret = some_client_secret
scopes = https://www.googleapis.com/auth/userinfo.profile https://www.googleapis.com/auth/userinfo.email
auth_url = https://accounts.google.com/o/oauth2/auth
token_url = https://oauth2.googleapis.com/token
api_url = https://www.googleapis.com/oauth2/v1/userinfo
allowed_domains = 
allow_sign_up = true

[auth.grafana_com]
enabled = false
allow_sign_up = true
client_id = some_id
client_secret = some_secret
scopes = user:email
allowed_organizations = 

[auth.okta]
name = Okta
enabled = false
allow_sign_up = true
client_id = some_id
client_secret = some_secret
scopes = openid,profile,email,groups
auth_url = https://your-domain.okta.com/oauth2/v1/authorize
token_url = https://your-domain.okta.com/oauth2/v1/token
api_url = https://your-domain.okta.com/oauth2/v1/userinfo
role_attribute_path = contains(groups[*], 'admin') && 'Admin' || contains(groups[*], 'editor') && 'Editor' || 'Viewer'
allowed_groups = 
role_attribute_strict = false
allow_assign_grafana_admin = false
auto_login = false

[auth.generic_oauth]
enabled = false
name = OAuth
allow_sign_up = true
client_id = some_id
client_secret = some_secret
scopes = user:email
email_attribute_name = email:primary
email_attribute_path = 
login_attribute_path = 
name_attribute_path = 
id_token_attribute_name = 
auth_url = https://foo.bar/login/oauth/authorize
token_url = https://foo.bar/login/oauth/access_token
api_url = https://foo.bar/user
team_ids = 
allowed_organizations = 
role_attribute_path = 
role_attribute_strict = false
allow_assign_grafana_admin = false
auto_login = false

[auth.basic]
enabled = true

[auth.proxy]
enabled = false
header_name = X-WEBAUTH-USER
header_property = username
auto_sign_up = true
# Deprecated, use sync_ttl instead
sync_ttl = 60
# Set to true to enable keep the signed in user's session in sync with TTL and extend TTL on each request
enable_login_token = false

[auth.jwt]
enabled = false
header_name = 
email_claim = 
username_claim = 
jwk_set_url = 
jwk_set_file = 
cache_ttl = 60m
expected_claims = {}
claim_mapping = 
auto_sign_up = false

[auth.ldap]
enabled = false
config_file = /etc/grafana/ldap.toml
allow_sign_up = true
auto_sign_up = true
# LDAP backround sync (Enterprise only)
# At 2:00 AM
sync_cron = "0 2 * * *"
active_sync = false
# Number of workers that will perform the sync
sync_workers = 2

# Set to true to enable the team sync (Enterprise only)
team_sync = false
# Comma separated list of team IDs to sync
team_ids = 
# Comma separated list of team names to sync
team_names = 
# Comma separated list of team org IDs to sync
team_org_ids = 

[log]
# Either "console", "file", "syslog". Default is console and  file
# Use space to separate multiple modes, e.g. "console file"
mode = console file

# Either "debug", "info", "warn", "error", "critical", default is "info"
level = info

# optional settings to set different levels for specific loggers. Ex filters = sqlstore:debug
filters = 

# For "console" mode only
[log.console]
level = 
format = console

# For "file" mode only
[log.file]
level = 
format = text

# This enables automated log rotate(switch of following options), default is true
log_rotate = true

# Max line number of single file, default is 1000000
max_lines = 1000000

# Max size shift of single file, default is 28 means 1 << 28, 256MB
max_size_shift = 28

# Segment log daily, default is true
daily_rotate = true

# Expire days, default is 7
max_days = 7

[log.syslog]
level = 
format = text

# Syslog network type and address. This can be udp, tcp, or unix. If left blank, the default unix endpoints will be used.
network = 
address = 
# Syslog facility. user, daemon and local0 through local7 are valid.
facility = 
# Syslog tag. By default, the process' argv[0] is used.
tag = 

[quota]
# set to true to enable usage reporting to stats.grafana.org (for privacy, please reference the docs)
reporting_enabled = false

# set to true to enable the quota tracking. Quota is tracked per user and per Organization.
enabled = false

# global limit of 1000 users
global_user = 1000

# global limit of 1000 orgs
global_org = 1000

# global limit of 1000 dashboards
global_dashboard = 1000

# global limit of 1000 data_sources
global_data_source = 1000

# global limit of 1000 api_keys
global_api_key = 1000

# per org limit of 1000 users
org_user = 1000

# per org limit of 1000 dashboards
org_dashboard = 1000

# per org limit of 1000 data_sources
org_data_source = 1000

# per org limit of 1000 api_keys
org_api_key = 1000

# per user limit of 1000 dashboards
user_dashboard = 1000

# per user limit of 1000 api_keys
user_api_key = 1000

[unified_alerting]

enabled = true


